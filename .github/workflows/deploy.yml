name: Deploy to Vercel

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: vercel-deploy
  cancel-in-progress: false

jobs:
  # ────────────────────────────────────────────────────────────────────────
  # JOB — Build & Deploy to Vercel
  # ────────────────────────────────────────────────────────────────────────
  deploy:
    name: Build & Deploy to Vercel
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.deployment_url }}

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────
      - name: Checkout source
        uses: actions/checkout@v4

      # ── 2. Entorno ─────────────────────────────────────────────────────
      - name: Log environment info
        run: |
          echo "::group::Environment Info"
          echo "Runner OS     : $RUNNER_OS"
          echo "Runner Arch   : $RUNNER_ARCH"
          echo "Git SHA       : $GITHUB_SHA"
          echo "Git Ref       : $GITHUB_REF"
          echo "Triggered by  : $GITHUB_ACTOR"
          echo "Timestamp     : $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          df -h / | tail -1 | awk '{print "Disk free     : "$4}'
          echo "::endgroup::"

      # ── 3. Node.js ─────────────────────────────────────────────────────
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Log Node / npm / Vercel CLI versions
        run: |
          echo "::group::Toolchain Versions"
          node --version
          npm --version
          npx vercel --version 2>/dev/null || echo "Vercel CLI: will be installed by npx"
          echo "::endgroup::"

      # ── 4. Install ─────────────────────────────────────────────────────
      - name: Install dependencies
        run: |
          echo "::group::npm ci"
          npm ci 2>&1
          echo "::endgroup::"
          echo "Packages installed: $(ls node_modules | wc -l)"

      # ── 5. Vercel pull (descarga config + env vars de produccion) ───────
      - name: Pull Vercel project settings
        id: pull
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          echo "::group::vercel pull"
          set +e
          npx vercel pull \
            --yes \
            --environment=production \
            --token=${{ secrets.VERCEL_TOKEN }} 2>&1 | tee /tmp/vercel_pull.log
          PULL_EXIT=${PIPESTATUS[0]}
          echo "::endgroup::"

          if [ "$PULL_EXIT" -ne 0 ]; then
            echo "::error title=Vercel Pull Failed::Could not download Vercel project settings. Check VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID secrets."
            exit 1
          fi

          echo "::notice::Vercel project settings downloaded."

      # ── 6. Build ───────────────────────────────────────────────────────
      - name: Build for production
        id: build
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          echo "::group::vercel build --prod"
          set +e
          npx vercel build \
            --prod \
            --token=${{ secrets.VERCEL_TOKEN }} 2>&1 | tee /tmp/vercel_build.log
          BUILD_EXIT=${PIPESTATUS[0]}
          echo "::endgroup::"

          if [ "$BUILD_EXIT" -ne 0 ]; then
            echo "::error title=Vercel Build Failed::Next.js build failed. See 'vercel build --prod' section above for details."
            echo "build_status=failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          echo "build_status=success" >> "$GITHUB_OUTPUT"
          echo "::notice title=Build OK::Next.js production build completed."

      # ── 7. Upload build log on failure ─────────────────────────────────
      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vercel-build-logs-${{ github.sha }}
          path: |
            /tmp/vercel_pull.log
            /tmp/vercel_build.log
          retention-days: 7

      # ── 8. Deploy ──────────────────────────────────────────────────────
      - name: Deploy prebuilt output to Vercel
        id: deploy
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          echo "::group::vercel deploy --prebuilt --prod"
          set +e
          DEPLOY_OUTPUT=$(npx vercel deploy \
            --prebuilt \
            --prod \
            --token=${{ secrets.VERCEL_TOKEN }} 2>&1 | tee /tmp/vercel_deploy.log)
          DEPLOY_EXIT=${PIPESTATUS[0]}
          echo "::endgroup::"

          # Extraer URL del output
          DEPLOY_URL=$(grep -oP 'https://[^\s]+\.vercel\.app[^\s]*' /tmp/vercel_deploy.log | tail -1)
          echo "deployment_url=${DEPLOY_URL:-https://cashtracker-web.vercel.app}" >> "$GITHUB_OUTPUT"
          echo "deploy_url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"

          if [ "$DEPLOY_EXIT" -ne 0 ]; then
            echo "::error title=Vercel Deploy Failed::Deployment upload failed. See 'vercel deploy' section above."
            exit 1
          fi

          echo "::notice title=Deployed!::Production URL: $DEPLOY_URL"

      # ── 9. Upload deploy log on failure ────────────────────────────────
      - name: Upload deploy log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vercel-deploy-log-${{ github.sha }}
          path: /tmp/vercel_deploy.log
          retention-days: 7

      # ── 10. Resumen final ──────────────────────────────────────────────
      - name: Write job summary
        if: always()
        run: |
          BUILD="${{ steps.build.outputs.build_status }}"
          URL="${{ steps.deploy.outputs.deploy_url }}"
          {
            echo "## Vercel Deploy Summary"
            echo ""
            echo "| Campo   | Valor |"
            echo "|---|---|"
            echo "| Commit  | \`$GITHUB_SHA\` |"
            echo "| Rama    | \`$GITHUB_REF_NAME\` |"
            echo "| Build   | \`${BUILD:-unknown}\` |"
            if [ -n "$URL" ]; then
              echo "| URL     | [$URL]($URL) |"
            fi
            echo "| Hora    | $(date -u '+%Y-%m-%dT%H:%M:%SZ') |"
            echo ""
            echo "> Logs completos disponibles en la pestaña **Actions** → este workflow → sección de cada paso."
          } >> "$GITHUB_STEP_SUMMARY"
