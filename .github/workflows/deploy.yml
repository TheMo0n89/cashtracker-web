name: Deploy to Vercel

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: vercel-deploy
  cancel-in-progress: false

# IDs del proyecto Vercel (no son secretos — son identificadores públicos)
# Fuente: cashtracker-web/.vercel/repo.json
env:
  VERCEL_ORG_ID: team_KToUgPxELer3zycCb8qlUnUr
  VERCEL_PROJECT_ID: prj_QXG4x2VoMAWXyBDDre689DYbjqRX

jobs:
  deploy:
    name: Build & Deploy to Vercel
    runs-on: ubuntu-latest
    # URL hardcodeada — no usar step outputs aquí (rompe el YAML en GitHub Actions)
    environment:
      name: production
      url: https://cashtracker-web.vercel.app

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Log environment info
        run: |
          echo "::group::Environment Info"
          echo "Runner OS      : $RUNNER_OS"
          echo "Git SHA        : $GITHUB_SHA"
          echo "Git Ref        : $GITHUB_REF_NAME"
          echo "Triggered by   : $GITHUB_ACTOR"
          echo "Timestamp      : $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          echo "Vercel Org ID  : $VERCEL_ORG_ID"
          echo "Vercel Proj ID : $VERCEL_PROJECT_ID"
          echo "::endgroup::"

      - name: Validate VERCEL_TOKEN secret
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "::error title=Secret Faltante — VERCEL_TOKEN::El secret VERCEL_TOKEN no está configurado."
            echo "::error::Obtenerlo: Vercel → Account Settings → Tokens → Create Token"
            echo "::error::Agregarlo: GitHub repo → Settings → Secrets and variables → Actions → New repository secret"
            exit 1
          fi
          echo "::notice::Secret VERCEL_TOKEN detectado."

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Log toolchain versions
        run: |
          echo "::group::Versiones"
          node --version
          npm --version
          echo "::endgroup::"

      - name: Install dependencies
        run: |
          echo "::group::npm ci"
          npm ci 2>&1
          echo "::endgroup::"

      - name: Pull Vercel project settings
        run: |
          echo "::group::vercel pull"
          npx vercel pull \
            --yes \
            --environment=production \
            --token="${{ secrets.VERCEL_TOKEN }}" 2>&1 | tee /tmp/vercel_pull.log
          PULL_EXIT=${PIPESTATUS[0]}
          echo "::endgroup::"
          if [ "$PULL_EXIT" -ne 0 ]; then
            echo "::error title=Vercel Pull Falló::Revisa VERCEL_TOKEN. Ver log arriba."
            exit 1
          fi

      - name: Build for production
        run: |
          echo "::group::vercel build --prod"
          npx vercel build \
            --prod \
            --token="${{ secrets.VERCEL_TOKEN }}" 2>&1 | tee /tmp/vercel_build.log
          BUILD_EXIT=${PIPESTATUS[0]}
          echo "::endgroup::"
          if [ "$BUILD_EXIT" -ne 0 ]; then
            echo "::error title=Build Falló::Ver log de build arriba para detalles del error."
            exit 1
          fi
          echo "::notice title=Build OK::Next.js build completado."

      - name: Deploy to Vercel Production
        id: deploy
        run: |
          echo "::group::vercel deploy --prebuilt --prod"
          npx vercel deploy \
            --prebuilt \
            --prod \
            --token="${{ secrets.VERCEL_TOKEN }}" 2>&1 | tee /tmp/vercel_deploy.log
          DEPLOY_EXIT=${PIPESTATUS[0]}
          DEPLOY_URL=$(grep -oE 'https://[a-zA-Z0-9._-]+\.vercel\.app' /tmp/vercel_deploy.log | tail -1 || echo "")
          echo "deploy_url=${DEPLOY_URL}" >> "$GITHUB_OUTPUT"
          echo "::endgroup::"
          if [ "$DEPLOY_EXIT" -ne 0 ]; then
            echo "::error title=Deploy Falló::Ver log de deploy arriba."
            exit 1
          fi
          echo "::notice title=Deployed!::URL: ${DEPLOY_URL:-https://cashtracker-web.vercel.app}"

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vercel-logs-${{ github.sha }}
          path: |
            /tmp/vercel_pull.log
            /tmp/vercel_build.log
            /tmp/vercel_deploy.log
          retention-days: 7

      - name: Write job summary
        if: always()
        run: |
          URL="${{ steps.deploy.outputs.deploy_url }}"
          {
            echo "## Vercel Deploy Summary"
            echo ""
            echo "| Campo  | Valor |"
            echo "|--------|-------|"
            echo "| Commit | \`$GITHUB_SHA\` |"
            echo "| Rama   | \`$GITHUB_REF_NAME\` |"
            if [ -n "$URL" ]; then
              echo "| URL    | [$URL]($URL) |"
            else
              echo "| URL    | https://cashtracker-web.vercel.app |"
            fi
            echo "| Hora   | $(date -u '+%Y-%m-%dT%H:%M:%SZ') |"
          } >> "$GITHUB_STEP_SUMMARY"
