name: Deploy to Vercel

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: vercel-deploy
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: team_KToUgPxELer3zycCb8qlUnUr
  VERCEL_PROJECT_ID: prj_QXG4x2VoMAWXyBDDre689DYbjqRX

jobs:
  deploy:
    name: Build & Deploy to Vercel
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://cashtracker-web.vercel.app

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # ──────────────────────────────────────────────────────────────────
      # PRE-FLIGHT — Validates all required secrets and env vars BEFORE
      # any build step. Fails fast with a clear checklist in the logs.
      # ──────────────────────────────────────────────────────────────────
      - name: Pre-flight validation
        env:
          CHECK_VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          echo "::group::Pre-flight Checklist"

          FAILED=0

          # ── 1. VERCEL_TOKEN ────────────────────────────────────────────
          if [ -z "$CHECK_VERCEL_TOKEN" ]; then
            echo "❌  VERCEL_TOKEN      — SECRET FALTANTE"
            echo "    → GitHub repo → Settings → Secrets → Actions → VERCEL_TOKEN"
            echo "    → Valor: Vercel → Account Settings → Tokens → Create Token"
            FAILED=1
          else
            echo "✅  VERCEL_TOKEN      — OK"
          fi

          # ── 2. NEXT_PUBLIC_API_URL (viene del .env.production descargado) ──
          # Esta variable se valida en el siguiente paso (post vercel pull)
          # porque vive en el dashboard de Vercel, no en GitHub Secrets.
          echo "⏭️  NEXT_PUBLIC_API_URL — se validará tras vercel pull"

          echo "::endgroup::"

          if [ "$FAILED" -ne 0 ]; then
            echo "::error title=Pre-flight Failed::Uno o más secrets/variables requeridos están ausentes. Ver checklist arriba."
            exit 1
          fi

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Log toolchain versions
        run: |
          echo "::group::Toolchain"
          node --version
          npm --version
          echo "::endgroup::"

      - name: Install dependencies
        run: |
          echo "::group::npm ci"
          npm ci 2>&1
          echo "::endgroup::"

      # ── Pull Vercel settings (downloads .env.production.local) ────────
      - name: Pull Vercel project settings
        run: |
          echo "::group::vercel pull"
          npx vercel pull \
            --yes \
            --environment=production \
            --token="${{ secrets.VERCEL_TOKEN }}" 2>&1 | tee /tmp/vercel_pull.log
          PULL_EXIT=${PIPESTATUS[0]}
          echo "::endgroup::"
          if [ "$PULL_EXIT" -ne 0 ]; then
            echo "::error title=Vercel Pull Falló::Revisa VERCEL_TOKEN. Log arriba."
            exit 1
          fi

      # ── Validate NEXT_PUBLIC_API_URL after pull ────────────────────────
      - name: Validate NEXT_PUBLIC_API_URL
        run: |
          echo "::group::NEXT_PUBLIC_API_URL Validation"

          # Source the env file Vercel just downloaded
          ENV_FILE=".vercel/.env.production.local"
          if [ -f "$ENV_FILE" ]; then
            API_URL=$(grep '^NEXT_PUBLIC_API_URL=' "$ENV_FILE" | cut -d'=' -f2- | tr -d '"' | tr -d "'" | xargs)
          fi

          # Fallback: check if it's a GitHub secret / env var already exposed
          API_URL="${API_URL:-${NEXT_PUBLIC_API_URL:-}}"

          FAILED=0

          if [ -z "$API_URL" ]; then
            echo "❌  NEXT_PUBLIC_API_URL — VACÍA o NO CONFIGURADA"
            echo "    → Vercel Dashboard → cashtracker-web → Settings → Environment Variables"
            echo "    → Nombre: NEXT_PUBLIC_API_URL"
            echo "    → Valor esperado: https://cashtracker-api-mggy.onrender.com/v1"
            FAILED=1
          elif echo "$API_URL" | grep -qE '[[:space:]]'; then
            echo "❌  NEXT_PUBLIC_API_URL — CONTIENE ESPACIOS"
            echo "    → Valor actual (ofuscado): ${API_URL:0:10}..."
            echo "    → Elimina espacios en blanco desde el dashboard de Vercel."
            FAILED=1
          elif echo "$API_URL" | grep -qE '^[\"'"'"']'; then
            echo "❌  NEXT_PUBLIC_API_URL — COMIENZA CON COMILLAS"
            echo "    → Guarda el valor sin comillas en el dashboard de Vercel."
            FAILED=1
          elif ! echo "$API_URL" | grep -qE '^https?://'; then
            echo "❌  NEXT_PUBLIC_API_URL — SIN PROTOCOLO http:// o https://"
            echo "    → Valor actual (ofuscado): ${API_URL:0:15}..."
            echo "    → Formato esperado: https://cashtracker-api-mggy.onrender.com/v1"
            echo "    → next.config.ts aplicará auto-corrección, pero es mejor corregirla en origen."
            FAILED=1
          else
            # Mask most of the URL to avoid leaking
            MASKED="${API_URL:0:8}***${API_URL: -4}"
            echo "✅  NEXT_PUBLIC_API_URL — OK ($MASKED)"
          fi

          echo "::endgroup::"

          if [ "$FAILED" -ne 0 ]; then
            echo "::error title=NEXT_PUBLIC_API_URL Inválida::Ver checklist arriba para el formato esperado."
            # No hacemos exit 1 aquí — next.config.ts tiene auto-corrección,
            # el build puede continuar. Sí advertimos fuerte.
            echo "::warning::El build continuará gracias al auto-fix en next.config.ts, pero corrige la variable en Vercel Dashboard."
          fi

      # ── Build & Deploy to Vercel (Cloud Build) ─────────────────────────
      - name: Build & Deploy to Vercel Production
        id: deploy
        run: |
          echo "::group::npx vercel --prod"
          npx vercel \
            --prod \
            --token="${{ secrets.VERCEL_TOKEN }}" 2>&1 | tee /tmp/vercel_deploy.log
          DEPLOY_EXIT=${PIPESTATUS[0]}
          echo "::endgroup::"
          echo "=== VERCEL DEPLOY LOG ==="
          cat /tmp/vercel_deploy.log
          DEPLOY_URL=$(grep -oE 'https://[a-zA-Z0-9._-]+\.vercel\.app' /tmp/vercel_deploy.log | tail -1 || echo "")
          echo "deploy_url=${DEPLOY_URL}" >> "$GITHUB_OUTPUT"
          if [ "$DEPLOY_EXIT" -ne 0 ]; then
            echo "::error title=Deploy Falló::Ver log arriba."
            exit 1
          fi
          echo "::notice title=Deployed!::URL: ${DEPLOY_URL:-https://cashtracker-web.vercel.app}"

      # ── Upload logs on failure ─────────────────────────────────────────
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vercel-logs-${{ github.sha }}
          path: |
            /tmp/vercel_pull.log
            /tmp/vercel_build.log
            /tmp/vercel_deploy.log
          retention-days: 7

      # ── Job Summary ────────────────────────────────────────────────────
      - name: Write job summary
        if: always()
        run: |
          URL="${{ steps.deploy.outputs.deploy_url }}"
          {
            echo "## Vercel Deploy Summary"
            echo ""
            echo "| Check | Estado |"
            echo "|-------|--------|"
            echo "| VERCEL_TOKEN         | ✅ Presente |"
            echo "| NEXT_PUBLIC_API_URL  | ver log Pre-flight |"
            echo "| Build                | ver log Build |"
            echo "| Deploy               | ver log Deploy |"
            echo ""
            echo "| Campo  | Valor |"
            echo "|--------|-------|"
            echo "| Commit | \`$GITHUB_SHA\` |"
            echo "| Rama   | \`$GITHUB_REF_NAME\` |"
            if [ -n "$URL" ]; then
              echo "| URL    | [$URL]($URL) |"
            else
              echo "| URL    | https://cashtracker-web.vercel.app |"
            fi
            echo "| Hora   | $(date -u '+%Y-%m-%dT%H:%M:%SZ') |"
          } >> "$GITHUB_STEP_SUMMARY"
